<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noch ein Klick – LifeStrings Timer</title>
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="light dark">

    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16.png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <style>
        @font-face {
            font-family: 'Plus Jakarta Sans';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url(../../assets/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'Plus Jakarta Sans';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url(../../assets/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #faf8f5;
            --text: #1c1a17;
            --muted: #8a7f72;
            --rahmen: rgba(0, 0, 0, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1e1c19;
                --text: #ede9e3;
                --muted: #7a7168;
                --rahmen: rgba(255, 255, 255, 0.07);
            }
        }

        html { font-size: 16px; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .seite {
            max-width: 44rem;
            margin: 0 auto;
            padding: 6rem 1.5rem 4rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        p {
            margin-top: 0.75rem;
            font-size: 1.125rem;
            max-width: 34rem;
        }

        footer {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--rahmen);
            color: var(--muted);
            font-size: 0.9375rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.5rem;
        }

        a { color: inherit; }

        footer a {
            text-decoration-color: var(--rahmen);
            text-underline-offset: 0.2em;
        }

        footer a:hover { color: var(--text); }

        @media (max-width: 30rem) {
            .seite { padding-top: 3.5rem; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="seite">

    <h1>Noch ein Klick</h1>
    <p>Im Postfach liegt gleich eine E-Mail mit einem Bestätigungsknopf. Erst danach steht die Adresse auf der Liste.</p>

    <footer>
        <a href="/">naturalconsult.de</a>
        <a href="/lifestrings-timer/">LifeStrings Timer</a>
        <a href="/impressum/">Impressum</a>
        <a href="/datenschutz/">Datenschutz</a>
    </footer>

</div>

</body>
</html>
